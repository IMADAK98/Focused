spring.application.name=Focused
spring.config.import=optional:classpath:application-local.properties
spring.profiles.default=poc
spring.profiles.active=poc

spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY:}
spring.ai.google.genai.chat.model=gemini-3.6-flash
spring.ai.google.genai.chat.temperature=0.7

# poc: in-memory, no DB. postgres: application-postgres.properties
focused.ai.enabled=false
